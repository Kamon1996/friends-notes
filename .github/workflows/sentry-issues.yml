name: Sentry issues

# Ошибки приложения в Sentry: посмотреть (со стеком, устройством и последними шагами — в итог запуска) и отметить:
# «починено» с комментарием (коммит и версия), просто комментарий или вернуть в открытые.
# Запуск: вручную (Actions → Sentry issues) или коммитом с «[sentry]» в первой строке (только просмотр).
# Нужен секрет репозитория SENTRY_READ_TOKEN — личный токен Sentry: Project: Read, Organization: Read,
# Issue & Event: Read & Write.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать'
        type: choice
        default: list
        options: [list, resolve, note, reopen]
      note:
        description: 'Комментарий (для resolve / note / reopen)'
        default: ''
      query:
        description: 'Фильтр Sentry'
        default: 'is:unresolved'
      days:
        description: 'За сколько дней'
        default: '14'
      issue:
        description: 'Номер одной проблемы (необязательно)'
        default: ''
  push:
    branches: [main, claude/mobile-project-creation-pgqs46]

permissions:
  contents: read

jobs:
  issues:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sentry]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sentry
        env:
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          # Поля запуска — через переменные, а не вставкой в команду.
          QUERY: ${{ github.event.inputs.query || 'is:unresolved' }}
          DAYS: ${{ github.event.inputs.days || '14' }}
          ISSUE: ${{ github.event.inputs.issue || '' }}
          ACTION: ${{ github.event.inputs.action || 'list' }}
          NOTE: ${{ github.event.inputs.note || '' }}
        run: python3 scripts/sentry/issues.py "$ACTION" --query "$QUERY" --days "$DAYS" --issue "$ISSUE" --note "$NOTE"

name: Tests

# Типы, линтер, юнит-тесты и сквозные сценарии на веб-сборке — без подписи и секретов.
# Запуск:
#  - вместе со сборкой: коммитом со словом «[apk]», «[aab]» или «[apk-cloud]» в сообщении;
#  - отдельно: коммитом со словом «[tests]»;
#  - на пул-реквест и вручную (Actions → «Tests» → Run workflow).
# На каждый пуш не запускаем: у приватного репозитория минуты GitHub Actions ограничены, и когда они кончаются,
# не стартует и сборка. Те же проверки идут локально перед каждым коммитом.
on:
  push:
    branches: [main, claude/mobile-project-creation-pgqs46]
  pull_request:
  workflow_dispatch:

# Новый запуск отменяет прежний той же ветки. Коммит, на котором тесты не идут, получает свою группу —
# иначе он отменил бы идущие тесты сборочного коммита.
concurrency:
  group: >-
    tests-${{ github.ref }}-${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[apk]') || contains(github.event.head_commit.message, '[aab]') || contains(github.event.head_commit.message, '[apk-cloud]') || contains(github.event.head_commit.message, '[tests]')) && 'run' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Проверки и сквозные тесты
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[apk]') || contains(github.event.head_commit.message, '[aab]') ||
      contains(github.event.head_commit.message, '[apk-cloud]') || contains(github.event.head_commit.message, '[tests]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Web build
        env:
          EXPO_OFFLINE: '1'
          CI: '1'
        run: npx expo export --platform web --output-dir dist-web
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end scenarios
        run: node scripts/e2e-web.js dist-web e2e-results
      - name: Screenshots of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results
          if-no-files-found: ignore
          retention-days: 7

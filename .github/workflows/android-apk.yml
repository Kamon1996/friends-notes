name: Android APK

# Запуск:
#  - коммитом со словом «[apk]» в первой строке сообщения — сборка прямо на машине GitHub (квота EAS не тратится),
#    готовый APK прикрепляется к релизу на GitHub, ссылка в итогах запуска;
#  - коммитом со словом «[aab]» — то же, но Android App Bundle для Google Play (профиль production);
#  - коммитом со словом «[apk-cloud]» — облачная сборка в EAS, как раньше;
#  - вручную: вкладка Actions → «Android APK» → Run workflow, там же выбирается режим.
# Нужны секреты репозитория EXPO_TOKEN (подпись и проект EAS), TG_API_ID и TG_API_HASH; по желанию ключи облачных ИИ
# с бесплатными тарифами: GEMINI_API_KEY (Google AI Studio), OPENROUTER_API_KEY (openrouter.ai), HF_TOKEN
# (huggingface.co, fine-grained: «Make calls to Inference Providers») — см. src/lib/ai
# (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Где собирать'
        type: choice
        default: local
        options: [local, aab, cloud]
  push:
    branches: [main, claude/mobile-project-creation-pgqs46]

# Сборки одной ветки идут по очереди. GitHub держит в очереди только одну ждущую сборку группы и отменяет прежнюю,
# поэтому коммит без [apk]/[aab] (сборки не будет) получает свою группу — иначе он отменил бы ждущую сборку.
concurrency:
  group: >-
    apk-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]') || contains(github.event.head_commit.message, '[aab]')) && 'build' || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Локальная сборка: eas build --local делает prebuild и gradle на машине GitHub,
  # подпись берёт ту же (из EAS), поэтому новая версия ставится поверх старой.
  local:
    name: Сборка на машине GitHub
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'cloud') ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[apk]') || contains(github.event.head_commit.message, '[aab]')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      # aab — Android App Bundle для Google Play (профиль production), иначе APK для прямой установки.
      # Тег берём только из первой строки сообщения коммита: в теле слова вроде «[aab]» могут встречаться в описании.
      - name: Pick build mode
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          SUBJECT=$(printf '%s' "$MESSAGE" | head -n 1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "$INPUT_MODE" = "aab" ] && BUNDLE=true || BUNDLE=false
          else
            case "$SUBJECT" in *"[aab]"*) BUNDLE=true ;; *) BUNDLE=false ;; esac
          fi
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "Режим: $([ "$BUNDLE" = true ] && echo AAB || echo APK) · «$SUBJECT»"
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "### ❌ Не задан секрет EXPO_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "Добавь его: Settings → Secrets and variables → Actions → New repository secret." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::EXPO_TOKEN secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Полной сборке нужно место: убираем с машины то, что ей не нужно.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Link EAS project
        run: npx eas-cli@latest init --non-interactive --force

      # Ключи Telegram API попадают в конфиг приложения только в момент сборки и не коммитятся.
      - name: Inject Telegram API keys
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const apiId = Number(process.env.TG_API_ID || 0);
            const apiHash = process.env.TG_API_HASH || "";
            const dsn = process.env.SENTRY_DSN || (a.expo.extra && a.expo.extra.sentry && a.expo.extra.sentry.dsn) || "";
            // Ключи облачных ИИ (src/lib/ai): нет ключа — сервис просто пропускается.
            const ai = { gemini: process.env.GEMINI_API_KEY || "", openrouter: process.env.OPENROUTER_API_KEY || "", huggingface: process.env.HF_TOKEN || "" };
            a.expo.extra = { ...a.expo.extra, telegram: { apiId, apiHash }, sentry: { dsn }, ai };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
            console.log("Telegram keys:", apiId && apiHash ? "set" : "MISSING", "· Sentry DSN:", dsn ? "set" : "MISSING", "· AI keys:", Object.entries(ai).map(([k, v]) => `${k} ${v ? "set" : "нет"}`).join(", "));
          '

      # services.gradle.org иногда отвечает 504 или не успевает за 10 с — и сборка падает ещё до компиляции.
      # Поэтому Gradle скачиваем заранее: с повторами и длинным таймаутом; сборка потом берёт его из ~/.gradle.
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Warm up Gradle
        run: |
          # prebuild может дописать package.json и app.json — сохраняем их как есть, сборка должна взять исходные.
          cp package.json "$RUNNER_TEMP/package.json.bak"; cp app.json "$RUNNER_TEMP/app.json.bak"
          npx expo prebuild --platform android --no-install > /dev/null
          cp "$RUNNER_TEMP/package.json.bak" package.json; cp "$RUNNER_TEMP/app.json.bak" app.json
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          ok=""
          for i in 1 2 3 4 5; do
            if (cd android && ./gradlew --version --no-daemon -q > /dev/null); then ok=1; break; fi
            echo "Gradle не скачался (попытка $i), ждём и пробуем ещё"; sleep $((i * 20))
          done
          # Папка android — только для прогрева: сборка делает свою, из app.json.
          rm -rf android
          [ -n "$ok" ] || { echo "::error::Не удалось скачать Gradle с services.gradle.org"; exit 1; }

      - name: Build on this machine
        env:
          # Собираем рабочую папку как есть (с подставленными ключами), а не последний коммит.
          EAS_NO_VCS: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          # Телефоны — arm64; остальные архитектуры не собираем (TDLib в проекте только под arm64-v8a).
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          # Токен Sentry — для загрузки sourcemaps и символов; без него сборка идёт, а загрузка пропускается.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then export SENTRY_DISABLE_AUTO_UPLOAD=true; echo "Sentry: токена нет, sourcemaps не загружаем"; fi
          mkdir -p "$EAS_LOCAL_BUILD_WORKINGDIR"
          if [ "$BUNDLE" = "true" ]; then
            npx eas-cli@latest build --platform android --profile production --local --non-interactive --output "$PWD/friends-notes.aab"
            ls -la friends-notes.aab
          else
            npx eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$PWD/friends-notes.apk"
            ls -la friends-notes.apk
            # Какие разрешения реально попали в сборку — пригодится для анкет магазинов.
            AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
            { echo "### Разрешения в APK"; echo '```'; "$AAPT" dump permissions friends-notes.apk | grep -o "android.permission.[A-Z_]*" | sort -u; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          df -h / | tail -1

      # Сначала сохраняем сборку артефактом запуска: даже если релиз не создастся, файл не пропадёт.
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: friends-notes-build
          path: |
            friends-notes.apk
            friends-notes.aab
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach the build to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v$VERSION"
          if [ "$BUNDLE" = "true" ]; then FILE="friends-notes-$VERSION.aab"; cp friends-notes.aab "$FILE"; else FILE="friends-notes-$VERSION.apk"; cp friends-notes.apk "$FILE"; fi
          # Описание релиза — пункты «Что нового» этой версии (scripts/releases/notes.ts).
          BODY=$(npx tsx scripts/releases/notes.ts "$VERSION")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Через gh api, а не gh release create: при отказе GitHub показывает полный ответ, а не одну строку.
            # Тег — на текущую вершину ветки, а не на коммит сборки: пока шла сборка, в ветку могли прийти коммиты
            # с изменёнными workflow, и тогда робот Actions не может поставить тег на старый коммит (403 «Resource not
            # accessible by integration» — GitHub считает это изменением workflow). Коммит сборки — в описании релиза.
            create_release() {
              gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$TAG" -f target_commitish="$GITHUB_REF_NAME" -f name="Друзья $VERSION" \
                -f body="$BODY" >release.log 2>&1
            }
            created=false
            for wait in 0 30 90; do
              sleep "$wait"
              if create_release || gh release view "$TAG" >/dev/null 2>&1; then created=true; break; fi
              echo "Релиз не создался, попробую ещё раз: $(head -c 300 release.log)"
            done
            if [ "$created" != "true" ]; then
              cat release.log
              echo "Правила для тегов (Settings → Rules → Rulesets):"
              gh api "repos/$GITHUB_REPOSITORY/rulesets?targets=tag" --jq '.[] | "  \(.name): \(.enforcement)"' || true
              {
                echo "### ⚠️ Сборка готова, но релиз не создан"
                echo ""
                echo "Файл лежит в артефактах этого запуска (архив, нужен вход в GitHub): $ARTIFACT_URL"
                echo ""
                echo "Ответ GitHub:"
                echo '```'
                cat release.log
                echo '```'
                echo ""
                echo "Опубликовать без пересборки: коммит со словами «[publish $GITHUB_RUN_ID]» в первой строке (workflow «Publish APK»)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Не удалось создать релиз $TAG, сборка сохранена артефактом: $ARTIFACT_URL"
              exit 1
            fi
          fi
          gh release upload "$TAG" "$FILE" --clobber
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE"
          {
            if [ "$BUNDLE" = "true" ]; then echo "### ✅ AAB для Google Play готов"; else echo "### ✅ APK готов"; fi
            echo ""
            echo "Файл: $URL"
            echo ""
            echo "Все версии: https://github.com/$GITHUB_REPOSITORY/releases"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $URL"

  # Облачный путь (EAS): быстрая проверка нативного кода, потом сборка на серверах Expo.
  compile:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'cloud') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-cloud]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost || true
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Compile local native modules
        working-directory: android
        run: ./gradlew :contacts-raw:compileDebugKotlin :telegram:compileDebugKotlin --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

  cloud:
    name: Сборка в EAS
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test
      - name: Link EAS project
        run: npx eas-cli@latest init --non-interactive --force
      - name: Inject Telegram API keys
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const apiId = Number(process.env.TG_API_ID || 0);
            const apiHash = process.env.TG_API_HASH || "";
            const dsn = process.env.SENTRY_DSN || (a.expo.extra && a.expo.extra.sentry && a.expo.extra.sentry.dsn) || "";
            // Ключи облачных ИИ (src/lib/ai): нет ключа — сервис просто пропускается.
            const ai = { gemini: process.env.GEMINI_API_KEY || "", openrouter: process.env.OPENROUTER_API_KEY || "", huggingface: process.env.HF_TOKEN || "" };
            a.expo.extra = { ...a.expo.extra, telegram: { apiId, apiHash }, sentry: { dsn }, ai };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
            console.log("Telegram keys:", apiId && apiHash ? "set" : "MISSING", "· Sentry DSN:", dsn ? "set" : "MISSING", "· AI keys:", Object.entries(ai).map(([k, v]) => `${k} ${v ? "set" : "нет"}`).join(", "));
          '
      - name: Start Android build
        env:
          EAS_NO_VCS: '1'
        run: |
          npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait --json > build.json
          cat build.json
          BUILD_ID=$(node -e 'const b=JSON.parse(require("fs").readFileSync("build.json","utf8"));console.log((Array.isArray(b)?b[0]:b).id)')
          URL="https://expo.dev/accounts/kamon1996/projects/friends-notes/builds/$BUILD_ID"
          {
            echo "### ✅ Сборка APK запущена в EAS"
            echo ""
            echo "Открой на телефоне: $URL"
            echo ""
            echo "Когда статус станет **Finished**, нажми **Install** / **Download** и установи APK."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Build page: $URL"

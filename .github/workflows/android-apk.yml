name: Android APK (EAS Build)

# Запуск:
#  - вручную: вкладка Actions → «Android APK (EAS Build)» → Run workflow
#    (кнопка появляется, когда этот файл есть в ветке по умолчанию);
#  - коммитом, в сообщении которого есть «[apk]».
# Нужен секрет репозитория EXPO_TOKEN (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:
  push:
    branches: [main, claude/mobile-project-creation-pgqs46]

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Быстрая проверка, что нативный код (в том числе локальные модули) компилируется.
  # Логи видны в GitHub, и сборка в EAS не тратится впустую.
  compile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      # Полная сборка React Native (C++ под все архитектуры) не помещается в обычную машину GitHub.
      # Проверяем только Kotlin наших локальных модулей — быстро, а полную сборку делает EAS.
      - name: Compile local native modules
        working-directory: android
        run: ./gradlew :contacts-raw:compileDebugKotlin :telegram:compileDebugKotlin --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

  build:
    needs: compile
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "### ❌ Не задан секрет EXPO_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "Добавь его: Settings → Secrets and variables → Actions → New repository secret." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::EXPO_TOKEN secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Link EAS project
        run: npx eas-cli@latest init --non-interactive --force

      # Ключи Telegram API попадают в конфиг приложения только в момент сборки и не коммитятся.
      - name: Inject Telegram API keys
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const apiId = Number(process.env.TG_API_ID || 0);
            const apiHash = process.env.TG_API_HASH || "";
            a.expo.extra = { ...a.expo.extra, telegram: { apiId, apiHash } };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
            console.log("Telegram keys:", apiId && apiHash ? "set" : "MISSING");
          '

      - name: Start Android build
        env:
          # Загружаем рабочую папку как есть (с подставленными ключами), а не последний коммит.
          EAS_NO_VCS: '1'
        run: |
          npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait --json > build.json
          cat build.json
          BUILD_ID=$(node -e 'const b=JSON.parse(require("fs").readFileSync("build.json","utf8"));console.log((Array.isArray(b)?b[0]:b).id)')
          URL="https://expo.dev/accounts/kamon1996/projects/friends-notes/builds/$BUILD_ID"
          {
            echo "### ✅ Сборка APK запущена"
            echo ""
            echo "Открой на телефоне: $URL"
            echo ""
            echo "Когда статус станет **Finished**, нажми **Install** / **Download** и установи APK."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Build page: $URL"

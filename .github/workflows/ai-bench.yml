name: AI bench

# Испытание бесплатных моделей ИИ на задаче приложения (src/lib/ai/bench.ts): все модели получают один и тот же набор
# имён тем же запросом, что в приложении; в итогах — таблица, в логе — подробности по каждой модели (BENCH_JSON).
# Запуск: коммитом со словом «[bench]» в первой строке или вручную (Actions → AI bench → Run workflow).
# Ключи — те же секреты, что для сборки: GEMINI_API_KEY, OPENROUTER_API_KEY, HF_TOKEN, по желанию GROQ_API_KEY.
on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Сервисы через запятую'
        default: 'gemini,openrouter,huggingface'
      batch:
        description: 'Имён в одном запросе'
        default: '50'
      max_models:
        description: 'Сколько моделей одного сервиса испытать'
        default: '40'
      only:
        description: 'Только эти модели (openrouter:id,gemini:id), пусто — все'
        default: ''
  push:
    branches: [main, claude/mobile-project-creation-pgqs46]

permissions:
  contents: read

concurrency:
  group: ai-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bench]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run bench
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BENCH_PROVIDERS: ${{ github.event.inputs.providers || 'gemini,openrouter,huggingface' }}
          BENCH_BATCH: ${{ github.event.inputs.batch || '50' }}
          BENCH_MAX_MODELS: ${{ github.event.inputs.max_models || '40' }}
          BENCH_ONLY: ${{ github.event.inputs.only || '' }}
        run: npx tsx scripts/ai-bench/run.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-bench-results
          path: bench-results.json
          if-no-files-found: ignore
          retention-days: 30
